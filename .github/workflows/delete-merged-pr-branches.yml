name: Delete merged PR branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ "$BRANCH" == "main" || "$BRANCH" == "master" ]]; then
            echo "Refusing to delete a protected/default branch."
            exit 1
          fi
          if gh api --method DELETE "repos/$REPO/git/refs/heads/$BRANCH"; then
            echo "Deleted merged branch: $BRANCH"
          else
            echo "::warning::Branch deletion failed (already deleted, protected, or insufficient permissions)."
          fi
